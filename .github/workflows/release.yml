name: Publish launcher release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, e.g. 0.12.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_build.txt

      - name: Verify requested version matches source
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must look like 1.2.3 (got '$env:VERSION')"
          }
          $SourceVersion = python -c "from futonhub_auto import LAUNCHER_VERSION; print(LAUNCHER_VERSION)"
          if ($SourceVersion.Trim() -ne $env:VERSION) {
            throw "Requested version $env:VERSION does not match source version $SourceVersion"
          }
          $Info = Get-Content assets/version_info.txt -Raw
          if ($Info -notmatch "ProductVersion', '$([regex]::Escape($env:VERSION))'") {
            throw "assets/version_info.txt does not declare version $env:VERSION"
          }

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile sources
        run: python -m compileall -q main.py futonhub_auto

      - name: Build Windows executable
        shell: cmd
        env:
          CI: "true"
        run: build_launcher.bat

      - name: Verify checksum file matches the executable
        shell: pwsh
        run: |
          $Expected = (Get-Content dist/FutonHUB-Launcher.exe.sha256 -Raw).Trim().Split(' ')[0].ToLower()
          $Actual = (Get-FileHash dist/FutonHUB-Launcher.exe -Algorithm SHA256).Hash.ToLower()
          if ($Expected -ne $Actual) { throw "Checksum mismatch: $Expected vs $Actual" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $Tag = "launcher-v$env:VERSION"
          gh release create $Tag `
            "dist/FutonHUB-Launcher.exe" `
            "dist/FutonHUB-Launcher.exe.sha256" `
            --repo $env:REPO `
            --target $env:SHA `
            --title "FutonHUB Launcher $env:VERSION" `
            --generate-notes