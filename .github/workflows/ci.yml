name: CI Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_build.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile sources
        run: python -m compileall -q main.py futonhub_auto

      - name: Build Windows executable
        shell: cmd
        env:
          CI: "true"
        run: build_launcher.bat

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FutonHUB-Launcher.exe -ArgumentList '--selftest','selftest.json' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.json)) { throw "Executable self-test failed (exit $($p.ExitCode))" }
          if (-not ((Get-Content selftest.json -Raw | ConvertFrom-Json).ok)) { throw "Self-test reported failure" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FutonHUB-Launcher-${{ github.sha }}
          path: |
            dist/FutonHUB-Launcher.exe
            dist/FutonHUB-Launcher.exe.sha256
          if-no-files-found: error